name: Release setup
description: >-
  Assume the AWS signing role through GitHub OIDC, log in to the Garasign ECR
  registry, and write the Garasign credentials from AWS Secrets Manager to a
  private env file for the sign-artifacts action.
  Adapted from mongodb-developer/claude-agent-sdk-mongodb-session-store#8.

inputs:
  aws_role_arn:
    description: AWS IAM role (trusting this repository's OIDC subject) that can read the signing secret.
    required: true
  aws_region:
    description: AWS region of the signing role and Secrets Manager secret.
    required: true
  aws_secret_id:
    description: >-
      AWS Secrets Manager secret id or ARN. Its JSON must contain
      garasign-username and garasign-password; gpg-key-id is optional and, when
      set, sign-artifacts checks that signatures were made with that key.
    required: true
  ecr_registry_id:
    description: AWS account id of the ECR registry that hosts the Garasign images.
    default: "901841024863"
  ecr_role_arn:
    description: Read-only role used to pull the Garasign images from ECR.
    default: "arn:aws:iam::901841024863:role/ecr-role-gha-ro"
  ecr_region:
    description: Region of the ECR registry.
    default: us-east-1

runs:
  using: composite
  steps:
    # ECR login happens first so the Docker credential survives the second
    # role assumption below.
    - name: Assume ECR read-only role
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.ecr_role_arn }}
        role-session-name: release-signing-ecr
        aws-region: ${{ inputs.ecr_region }}

    - name: Log in to the Garasign ECR registry
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      with:
        registries: ${{ inputs.ecr_registry_id }}

    - name: Assume signing-secrets role
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.aws_role_arn }}
        role-session-name: release-signing-secrets
        aws-region: ${{ inputs.aws_region }}

    # The blank alias (leading comma) names the variables after the JSON keys only:
    # garasign-username -> GARASIGN_USERNAME, gpg-key-id -> GPG_KEY_ID, and so on.
    - name: Load signing secrets into the environment
      uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
      with:
        secret-ids: ",${{ inputs.aws_secret_id }}"
        parse-json-secrets: true

    # Garasign reads its credentials from an env file, so they never appear on a command line.
    # sign-artifacts reads the same fixed path.
    - name: Write Garasign env file
      shell: bash
      run: |
        set -eu
        : "${GARASIGN_USERNAME:?missing garasign-username in the signing secret}"
        : "${GARASIGN_PASSWORD:?missing garasign-password in the signing secret}"

        umask 077
        printf 'GRS_CONFIG_USER1_USERNAME=%s\nGRS_CONFIG_USER1_PASSWORD=%s\n' \
          "$GARASIGN_USERNAME" "$GARASIGN_PASSWORD" > "${RUNNER_TEMP}/garasign-envfile"
