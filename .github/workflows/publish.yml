name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # required for npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          # No dependency cache on the release path: a poisoned cache entry
          # could end up inside the published tarball.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match package.json version $version"
            exit 1
          fi

      - name: Lint (typecheck)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests (including built package checks)
        run: npm test

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
