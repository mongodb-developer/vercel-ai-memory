name: Release

on:
  release:
    types: [published]
  # Manual runs are dry runs: test, build, pack, and sign, but never publish
  # or attach anything to a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: $/.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          # No dependency cache on the release path: a poisoned cache entry
          # could end up inside the published tarball.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match package.json version $version"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Pack the tarball
        run: mkdir -p pkg && npm pack --pack-destination pkg/

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: pkg/
          if-no-files-found: error

  sign:
    name: Sign the tarball
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-signing
    permissions:
      contents: read
      id-token: write # required to assume the AWS signing role
    steps:
      # The setup action ends with `git config`, which needs a checked-out
      # repository even though signing itself only touches the tarball.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: pkg/

      - name: Set up signing credentials
        uses: mongodb-labs/drivers-github-tools/setup@99b1cbd729bc83bf7fc74e1b2a97fffad3d65d7b # v3.1.1
        with:
          aws_role_arn: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
          aws_region_name: ${{ secrets.AWS_SIGNING_REGION }}
          aws_secret_id: ${{ secrets.AWS_SIGNING_SECRET_ID }}

      - name: Sign the tarball with Garasign
        uses: mongodb-labs/drivers-github-tools/gpg-sign@99b1cbd729bc83bf7fc74e1b2a97fffad3d65d7b # v3.1.1
        with:
          filenames: pkg/*.tgz

      - name: Upload signature
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball-signature
          path: ${{ env.RELEASE_ASSETS }}/*.sig
          if-no-files-found: error

  publish:
    needs: [build, sign]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: pkg/

      # Publishing the packed tarball (not the checkout) guarantees npm gets
      # exactly the bytes attached to the release below.
      - name: Publish to npm
        run: npm publish ./pkg/*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  attach-tarball:
    name: Attach the tarball and signature to the release
    needs: [sign, publish]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # required to upload release assets
    steps:
      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: pkg/

      - name: Download signature
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball-signature
          path: pkg/

      - name: Checksum the signed tarball
        run: (cd pkg && sha256sum -- *.tgz *.sig > SHA256SUMS)

      - name: Upload tarball, signature, and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # no checkout here, so gh can't infer it
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        # --clobber lets a rerun replace assets left by a partially failed upload.
        run: gh release upload --clobber "$RELEASE_TAG" pkg/*.tgz pkg/*.sig pkg/SHA256SUMS
